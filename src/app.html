<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="icon" sizes="any" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Keep in sync with `ThemeToggle.svelte` (`pb.theme`). Applies before paint so `.dark` tokens + `dark:` utilities match immediately. -->
		<script>
			(function () {
				try {
					var k = 'pb.theme';
					var saved = localStorage.getItem(k);
					var dark =
						saved === 'dark' ||
						(saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {
					/* ignore */
				}
			})();
		</script>
		<!--
			Vendor plane — closed specifier list shared by ALL remote module
			chunks (esm-mount pages). Remote chunks import bare specifiers for
			by-design libraries; they resolve here to the host-published,
			versioned vendor bundles. Keep in sync with
			vendor/vite.vendor.config.ts (VENDOR_ENTRIES) and
			static/vendor/vendor-manifest.json.
		-->
		<script type="importmap">
			{
				"imports": {
					"svelte": "/vendor/svelte.js",
					"svelte/internal/client": "/vendor/svelte.js",
					"svelte/internal/disclose-version": "/vendor/svelte.js",
					"svelte/internal/flags/legacy": "/vendor/svelte.js",
					"svelte/events": "/vendor/svelte-events.js",
					"svelte/reactivity": "/vendor/svelte-reactivity.js",
					"svelte/store": "/vendor/svelte-store.js",
					"svelte/attachments": "/vendor/svelte-attachments.js",
					"@primebrick/core": "/vendor/primebrick-core.js",
					"@primebrick/ui": "/vendor/primebrick-ui.js",
					"@primebrick/ui/vendor/transformers": "/vendor/vendor-transformers.js",
					"@primebrick/ui/vendor/clsx": "/vendor/vendor-clsx.js",
					"@primebrick/ui/vendor/tailwind-merge": "/vendor/vendor-tailwind-merge.js",
					"@primebrick/ui/vendor/tailwind-variants": "/vendor/vendor-tailwind-variants.js",
					"@primebrick/ui/vendor/lucide": "/vendor/vendor-lucide.js",
					"@primebrick/ui/vendor/bits-ui": "/vendor/vendor-bits-ui.js"
				}
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
