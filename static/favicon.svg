  <rect x="34" y="4"  width="26" height="26" rx="5" fill="#2485e8"/>
  <rect x="4"  y="34" width="26" height="26" rx="5" fill="#3966e7"/>
  <rect x="34" y="34" width="26" height="26" rx="5" fill="#4f46e5"/>
  <circle cx="17" cy="17" r="4" fill="#ffffff"/>
</svg>
